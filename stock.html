<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In Stock | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="stock.html">In Stock</a></li><li><a class="nav-link" href="bulk-orders.html">Bulk Orders</a></li><li><a class="nav-link" href="requests.html">Requests</a></li><li><a class="nav-link" href="alerts.html">Stock Alerts</a></li><li><a class="nav-link" href="about.html">About</a></li><li><a class="nav-link" href="goal.html">Our Goal</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">LIVE INVENTORY</p><h1>What's in stock.</h1><p>Inventory is updated through the SwiftSupply admin system.</p></div></section><section class="section"><div class="container"><div id="stockStatus" class="status-box">Loading inventory...</div><div id="stockGrid" class="product-grid"></div></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/cart.js"></script><script>document.addEventListener('supabase-ready',loadStock);document.addEventListener('DOMContentLoaded',()=>{if(window.sb)loadStock()});async function loadStock(){const s=document.getElementById('stockStatus');try{const{data,error}=await sb.from('products').select('*').eq('active',true).gt('stock',0).order('category').order('name');if(error)throw error;s.textContent=data.length?data.length+' product'+(data.length===1?'':'s')+' currently in stock.':'Nothing is currently listed as in stock.';document.getElementById('stockGrid').innerHTML=data.map(p=>`<article class="product-card stock-product-card reveal visible"><a class="product-image stock-product-image" href="product.html?id=${encodeURIComponent(p.id)}">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:'<span>SwiftSupply</span>'}</a><div class="product-body"><span class="product-category">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="product-bottom"><strong>$${Number(p.price).toFixed(2)}</strong><span class="stock-pill in">${p.stock} in stock</span></div><div class="button-row"><button class="button button-primary add-stock" data-id="${p.id}">Add to Cart</button><a class="button button-secondary" href="product.html?id=${encodeURIComponent(p.id)}">Details</a></div></div></article>`).join('');document.querySelectorAll('.add-stock').forEach(b=>b.onclick=()=>{const p=data.find(x=>x.id===b.dataset.id);SwiftCart.add(p,1);b.textContent='Added';setTimeout(()=>b.textContent='Add to Cart',900)})}catch(e){console.error(e);s.textContent='Live inventory is not available right now.'}}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
