<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>In Stock | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="bulk-orders.html">Bulk</a></li><li><a class="nav-link" href="alerts.html">Alerts</a></li><li><a class="nav-link" href="about.html">About</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">LIVE INVENTORY</p><h1>Available right now.</h1><p>A quick view of products currently available. For search, filters, and the full catalog, head to the Shop.</p></div></section><section class="section"><div class="container"><div class="utility-bar"><a class="button button-secondary" href="shop.html">← Full shop</a><a class="button button-primary" href="checkout.html">View cart <span data-cart-count hidden>0</span></a></div><div id="stockStatus" class="status-box">Loading inventory...</div><div id="stockGrid" class="product-grid"></div></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/cart.js"></script><script>document.addEventListener('supabase-ready',loadStock);document.addEventListener('DOMContentLoaded',()=>{if(window.sb)loadStock();window.addEventListener('cart-updated',()=>{if(window.stockProducts)renderStock(window.stockProducts)})});async function loadStock(){const s=document.getElementById('stockStatus');try{const{data,error}=await sb.from('products').select('*').eq('active',true).gt('stock',0).order('category').order('name');if(error)throw error;window.stockProducts=data||[];renderStock(window.stockProducts)}catch(e){console.error(e);s.textContent='Live inventory is not available right now.'}}function renderStock(data){const s=document.getElementById('stockStatus'),grid=document.getElementById('stockGrid');const availableData=data.map(p=>({...p,available:Math.max(0,Number(p.stock||0)-SwiftCart.reserved(p.id))})).filter(p=>p.available>0);s.textContent=availableData.length?availableData.length+' product'+(availableData.length===1?'':'s')+' currently in stock.':'Nothing is currently available in stock.';grid.innerHTML=availableData.map(p=>`<article class="product-card stock-product-card reveal visible"><a class="product-image stock-product-image" href="product.html?id=${encodeURIComponent(p.id)}">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:'<span>SwiftSupply</span>'}</a><div class="product-body"><span class="product-category">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><div class="product-bottom"><strong>$${Number(p.price).toFixed(2)}</strong><span class="stock-pill in">${p.available} in stock</span></div><div class="button-row"><button class="button button-primary add-stock" data-id="${p.id}">Add to Cart</button><a class="button button-secondary" href="product.html?id=${encodeURIComponent(p.id)}">Details</a></div></div></article>`).join('');grid.querySelectorAll('.add-stock').forEach(b=>b.onclick=()=>{const p=data.find(x=>x.id===b.dataset.id);const result=SwiftCart.add(p,1);if(result.ok){b.textContent='Added';renderStock(data);setTimeout(()=>{if(document.body.contains(b))b.textContent='Add to Cart'},900)}else{b.textContent='Unavailable';setTimeout(()=>renderStock(data),900)}})}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
