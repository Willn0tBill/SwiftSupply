<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="bulk-orders.html">Bulk</a></li><li><a class="nav-link" href="alerts.html">Alerts</a></li><li><a class="nav-link" href="about.html">About</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">ORDER REQUEST</p><h1>Place an order.</h1><p>Submit what you'd like and SwiftSupply can review the request. This is a request system, not an online payment checkout.</p></div></section><section class="section"><div class="container form-shell"><form id="orderForm" class="reveal"><div class="form-grid"><div class="field-group"><label for="name">Name</label><input class="field" id="name" name="customer_name" required></div><div class="field-group"><label for="email">Email</label><input class="field" id="email" name="email" type="email"></div><div class="field-group"><label for="phone">Phone (optional)</label><input class="field" id="phone" name="phone" type="tel"></div><div class="field-group"><label for="type">Order type</label><select class="field" id="type" name="order_type"><option value="individual">Individual</option><option value="club">Club / Organization</option><option value="event">Event / Bulk</option></select></div><div class="field-group full"><label for="items">What would you like?</label><textarea class="field" id="items" name="items_text" rows="6" required placeholder="Example: 4 Monster, 2 Alani Nu, 3 Cheetos"></textarea></div><div class="field-group full"><label for="notes">Notes</label><textarea class="field" id="notes" name="notes" rows="4" placeholder="Pickup timing, event details, or other information."></textarea></div></div><input type="hidden" name="contact_method" value="either"><input type="hidden" name="items" id="itemsJson"><input type="hidden" name="total" value="0"><button class="button button-primary" type="submit">Submit Order Request</button><div id="message" class="form-message"></div></form></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>const params=new URLSearchParams(location.search);if(params.get('product'))document.getElementById('items').value=params.get('product');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function sendEmail(to,subject,html){if(!window.sb)throw Error('Database not configured');const{data,error}=await sb.functions.invoke('resend-email',{body:{to,subject,html}});if(error)throw error;if(!data?.ok)throw Error(data?.error||'Email could not be sent');return data}document.getElementById('orderForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('message'),b=f.querySelector('button');const email=document.getElementById('email').value.trim(),phone=document.getElementById('phone').value.trim();if(!email&&!phone){m.textContent='Please provide an email or phone number so we can respond.';m.classList.add('show');return}b.disabled=true;m.textContent='Submitting...';m.classList.add('show');try{if(!window.sb)throw Error('Database not configured');const fd=new FormData(f),name=String(fd.get('customer_name')),items=String(fd.get('items_text')),notes=String(fd.get('notes')||''),type=String(fd.get('order_type'));const payload={customer_name:name,email:email||null,phone:phone||null,contact_method:email&&phone?'either':email?'email':'phone',order_type:type,notes:notes||null,items:[{request:items}],total:0};const{error}=await sb.from('orders').insert(payload);if(error)throw error;const adminHtml=`<h2>New SwiftSupply order request</h2><p><strong>Name:</strong> ${esc(name)}</p><p><strong>Email:</strong> ${esc(email||'Not provided')}</p><p><strong>Phone:</strong> ${esc(phone||'Not provided')}</p><p><strong>Order type:</strong> ${esc(type)}</p><p><strong>Requested items:</strong><br>${esc(items).replace(/\n/g,'<br>')}</p><p><strong>Notes:</strong><br>${esc(notes||'None').replace(/\n/g,'<br>')}</p>`;await sendEmail(window.SWIFTSUPPLY_CONFIG.ADMIN_EMAIL,'New SwiftSupply order request',adminHtml);if(email){const customerHtml=`<h2>Thanks for your SwiftSupply order request!</h2><p>Hi ${esc(name)},</p><p>We received your request for:</p><p><strong>${esc(items).replace(/\n/g,'<br>')}</strong></p><p>We’ll review it and follow up using the contact information you provided.</p><p>SwiftSupply<br>Snacks. Drinks. Convenience.</p>`;await sendEmail(email,'We received your SwiftSupply order request',customerHtml)}f.reset();m.textContent='Order request submitted. We’ll review it and follow up.'}catch(err){console.error(err);m.textContent=err?.message==='Email could not be sent'?'Your order was saved, but the email notification could not be sent yet. Please contact SwiftSupply directly.':'Could not submit your order right now. Please try again later.'}finally{b.disabled=false}});</script></body></html>
