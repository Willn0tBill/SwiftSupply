<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track a SwiftSupply order request."><title>Track Order | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="checkout.html">Cart</a></li><li><a class="nav-link" href="faq.html">FAQ</a></li><li><a class="nav-link" href="support.html">Support</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">ORDER TRACKING</p><h1>Check your order.</h1><p>Use the order number and private tracking code from your confirmation email.</p></div></section><section class="section"><div class="container form-shell"><form id="trackForm" class="reveal"><div class="field-group"><label for="order">Order number</label><input class="field" id="order" placeholder="SS-1234ABCD" required></div><div class="field-group"><label for="token">Tracking code</label><input class="field" id="token" required></div><button class="button button-primary">Track Order</button><div id="message" class="form-message"></div></form><div id="result" class="admin-panel" hidden></div></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function money(v){return '$'+Number(v||0).toFixed(2)}function statusLabel(s){return ({new:'Received',confirmed:'Confirmed',ready:'Ready',completed:'Completed',cancelled:'Cancelled'}[s]||s)}async function lookup(){const order=document.getElementById('order').value.trim(),token=document.getElementById('token').value.trim(),m=document.getElementById('message'),r=document.getElementById('result');m.textContent='Checking...';m.classList.add('show');r.hidden=true;try{const {data,error}=await sb.rpc('get_order_status',{p_order_number:order,p_token:token});if(error)throw error;if(!data)throw Error('Order not found. Check the order number and tracking code.');r.innerHTML=`<p class="eyebrow">${esc(data.order_number)}</p><h2>${esc(statusLabel(data.status))}</h2><p>Order placed ${new Date(data.created_at).toLocaleString()}.</p><div class="order-status-timeline"><span class="${['new','confirmed','ready','completed'].indexOf(data.status)>=0?'done':''}">Received</span><span class="${['confirmed','ready','completed'].indexOf(data.status)>=0?'done':''}">Confirmed</span><span class="${['ready','completed'].indexOf(data.status)>=0?'done':''}">Ready</span><span class="${data.status==='completed'?'done':''}">Completed</span></div><h3>Items</h3><p>${(data.items||[]).map(i=>`${esc(i.quantity)} × ${esc(i.name)} — ${money(i.line_total)}`).join('<br>')}</p><p><strong>Estimated total: ${money(data.total)}</strong></p>${data.notes?`<p><strong>Notes:</strong> ${esc(data.notes)}</p>`:''}`;r.hidden=false;m.textContent=''}catch(e){m.textContent=e.message||'Could not find that order.'}}
document.addEventListener('DOMContentLoaded',()=>{const q=new URLSearchParams(location.search);if(q.get('order'))document.getElementById('order').value=q.get('order');if(q.get('token'))document.getElementById('token').value=q.get('token');document.getElementById('trackForm').addEventListener('submit',e=>{e.preventDefault();lookup()})});
</script></body></html>
