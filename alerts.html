<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Alerts | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="stock.html">In Stock</a></li><li><a class="nav-link" href="bulk-orders.html">Bulk Orders</a></li><li><a class="nav-link" href="requests.html">Requests</a></li><li><a class="nav-link" href="alerts.html">Stock Alerts</a></li><li><a class="nav-link" href="about.html">About</a></li><li><a class="nav-link" href="goal.html">Our Goal</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">STOCK ALERTS</p><h1>Know when it's back.</h1><p>Choose a product and leave an email address for a future restock notification.</p></div></section><section class="section"><div class="container form-shell"><form id="alertForm" class="reveal"><div class="field-group"><label for="email">Email</label><input class="field" id="email" name="email" type="email" required placeholder="you@example.com"></div><div class="field-group"><label for="product">Product</label><select class="field" id="product" name="product_id" required><option value="">Loading products...</option></select></div><button class="button button-primary" type="submit">Sign Me Up</button><div id="message" class="form-message"></div></form></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>let loadedProducts=[];async function setup(){if(!window.sb)return;const s=document.getElementById('product');const{data,error}=await sb.from('products').select('id,name,stock').eq('active',true).order('name');if(error){s.innerHTML='<option value="">Unavailable</option>';return}loadedProducts=data||[];s.innerHTML=loadedProducts.map(p=>`<option value="${p.id}">${esc(p.name)}${p.stock?' — '+p.stock+' in stock':' — notify me'}</option>`).join('')}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}document.addEventListener('supabase-ready',setup);document.addEventListener('DOMContentLoaded',()=>{if(window.sb)setup();document.getElementById('alertForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('message'),b=f.querySelector('button');b.disabled=true;m.classList.add('show');m.textContent='Saving...';try{if(!window.sb)throw Error('Database not configured');const fd=new FormData(f);const{error}=await sb.from('stock_alerts').insert({email:fd.get('email'),product_id:fd.get('product_id'),channel:'email',active:true});if(error)throw error;f.reset();m.textContent='You’re signed up for that product.'}catch(err){console.error(err);m.textContent='Could not save your alert right now.'}finally{b.disabled=false}})});</script></body></html>
