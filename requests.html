<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Requests | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="stock.html">In Stock</a></li><li><a class="nav-link" href="bulk-orders.html">Bulk Orders</a></li><li><a class="nav-link" href="requests.html">Requests</a></li><li><a class="nav-link" href="alerts.html">Stock Alerts</a></li><li><a class="nav-link" href="about.html">About</a></li><li><a class="nav-link" href="goal.html">Our Goal</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">PRODUCT REQUESTS</p><h1>Want us to carry it?</h1><p>Tell SwiftSupply what snack or drink you'd like to see. Requests are reviewed before anything is added.</p></div></section><section class="section"><div class="container form-shell"><form id="requestForm" class="reveal"><div class="form-grid"><div class="field-group"><label for="name">Name</label><input class="field" id="name" name="name" required></div><div class="field-group"><label for="product">Product</label><input class="field" id="product" name="requested_product" required></div><div class="field-group"><label for="category">Category</label><select class="field" id="category" name="category"><option>Drinks</option><option>Snacks</option><option>Other</option></select></div><div class="field-group"><label for="email">Email (optional)</label><input class="field" id="email" name="email" type="email"></div><div class="field-group full"><label for="notes">Anything else?</label><textarea class="field" id="notes" name="notes" rows="5" placeholder="Brand, flavor, size, or anything else that helps."></textarea></div></div><button class="button button-primary" type="submit">Submit Request</button><div id="message" class="form-message"></div></form></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function sendEmail(to,subject,html){if(!window.sb)throw Error('Database not configured');const{data,error}=await sb.functions.invoke('resend-email',{body:{to,subject,html}});if(error)throw error;if(!data?.ok)throw Error(data?.error||'Email could not be sent');return data}document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('requestForm');f.addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message'),b=f.querySelector('button');b.disabled=true;m.classList.add('show');m.textContent='Submitting...';try{if(!window.sb)throw Error('Database not configured');const fd=new FormData(f),name=String(fd.get('name')),product=String(fd.get('requested_product')),category=String(fd.get('category')),email=String(fd.get('email')||''),notes=String(fd.get('notes')||'');const payload={name,requested_product:product,category,notes:notes||null,email:email||null};const{error}=await sb.from('product_requests').insert(payload);if(error)throw error;const adminHtml=`<h2>New SwiftSupply product request</h2><p><strong>Name:</strong> ${esc(name)}</p><p><strong>Requested product:</strong> ${esc(product)}</p><p><strong>Category:</strong> ${esc(category)}</p><p><strong>Email:</strong> ${esc(email||'Not provided')}</p><p><strong>Notes:</strong><br>${esc(notes||'None').replace(/\n/g,'<br>')}</p>`;await sendEmail(window.SWIFTSUPPLY_CONFIG.ADMIN_EMAIL,'New SwiftSupply product request',adminHtml);if(email){const customerHtml=`<h2>SwiftSupply received your product request!</h2><p>Hi ${esc(name)},</p><p>We received your request for <strong>${esc(product)}</strong>.</p><p>We’ll review it and let you know if we’re able to add it.</p><p>SwiftSupply<br>Snacks. Drinks. Convenience.</p>`;await sendEmail(email,'We received your SwiftSupply product request',customerHtml)}f.reset();m.textContent='Request submitted. Thanks — we’ll review it.'}catch(err){console.error(err);m.textContent=err?.message==='Email could not be sent'?'Your request was saved, but the email notification could not be sent yet. Please contact SwiftSupply directly.':'Could not submit the request right now. Please try again later.'}finally{b.disabled=false}})});</script></body></html>
