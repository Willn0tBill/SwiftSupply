<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Requests | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="stock.html">In Stock</a></li><li><a class="nav-link" href="bulk-orders.html">Bulk Orders</a></li><li><a class="nav-link" href="requests.html">Requests</a></li><li><a class="nav-link" href="alerts.html">Stock Alerts</a></li><li><a class="nav-link" href="about.html">About</a></li><li><a class="nav-link" href="goal.html">Our Goal</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">PRODUCT REQUESTS</p><h1>Want us to carry it?</h1><p>Tell SwiftSupply what snack or drink you'd like to see. Requests are reviewed before anything is added.</p></div></section><section class="section"><div class="container form-shell"><form id="requestForm" class="reveal"><div class="form-grid"><div class="field-group"><label for="name">Name</label><input class="field" id="name" name="name" required></div><div class="field-group"><label for="product">Product</label><input class="field" id="product" name="requested_product" required></div><div class="field-group"><label for="category">Category</label><select class="field" id="category" name="category"><option>Drinks</option><option>Snacks</option><option>Other</option></select></div><div class="field-group"><label for="email">Email (optional)</label><input class="field" id="email" name="email" type="email"></div><div class="field-group full"><label for="notes">Anything else?</label><textarea class="field" id="notes" name="notes" rows="5" placeholder="Brand, flavor, size, or anything else that helps."></textarea></div></div><button class="button button-primary" type="submit">Submit Request</button><div id="message" class="form-message"></div></form></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('requestForm');f.addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message'),b=f.querySelector('button');b.disabled=true;m.classList.add('show');m.textContent='Submitting...';try{if(!window.sb)throw Error('Database not configured');const fd=new FormData(f),payload=Object.fromEntries(fd.entries());const{error}=await sb.from('product_requests').insert(payload);if(error)throw error;f.reset();m.textContent='Request submitted. Thanks — we’ll review it.'}catch(err){console.error(err);m.textContent='Could not submit the request right now. Please try again later.'}finally{b.disabled=false}})});</script></body></html>
