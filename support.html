<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="checkout.html">Cart</a></li><li><a class="nav-link" href="order.html">Track Order</a></li><li><a class="nav-link" href="faq.html">FAQ</a></li><li><a class="nav-link" href="support.html">Support</a></li></ul></nav></header><main><section class="page-hero"><div class="container reveal"><p class="eyebrow">SUPPORT</p><h1>Need a hand?</h1><p>Tell SwiftSupply what went wrong and we can help with an order, product, or website issue.</p></div></section><section class="section"><div class="container form-shell"><form id="supportForm" class="reveal"><div class="form-grid"><div class="field-group"><label for="name">Name</label><input class="field" id="name" name="name" required></div><div class="field-group"><label for="email">Email</label><input class="field" id="email" name="email" type="email" required></div><div class="field-group"><label for="order">Order number (optional)</label><input class="field" id="order" name="order_number"></div><div class="field-group full"><label for="messageText">What can we help with?</label><textarea class="field" id="messageText" name="message" rows="7" required></textarea></div></div><button class="button button-primary">Send Support Request</button><div id="message" class="form-message"></div></form></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">We’ll get back to you using the email you provide.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}async function sendEmail(to,subject,html){const{data,error}=await sb.functions.invoke('resend-email',{body:{to,subject,html}});if(error||!data?.ok)throw error||Error('Email failed')}document.getElementById('supportForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('message'),b=f.querySelector('button');b.disabled=true;m.textContent='Sending...';m.classList.add('show');try{const d=Object.fromEntries(new FormData(f));await sendEmail(SWIFTSUPPLY_CONFIG.ADMIN_EMAIL,'SwiftSupply support request',`<h2>Support request</h2><p><strong>Name:</strong> ${esc(d.name)}</p><p><strong>Email:</strong> ${esc(d.email)}</p><p><strong>Order:</strong> ${esc(d.order_number||'None')}</p><p><strong>Message:</strong><br>${esc(d.message).replace(/\n/g,'<br>')}</p>`);f.reset();m.textContent='Support request sent.'}catch(err){console.error(err);m.textContent='Could not send the support request right now.'}finally{b.disabled=false}});</script></body></html>
