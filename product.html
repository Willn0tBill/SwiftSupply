<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SwiftSupply product details."><title>Product | SwiftSupply</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="navbar container"><a class="brand" href="index.html"><img src="assets/logo.png" alt="SwiftSupply">Swift<span>Supply</span></a><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links"><li><a class="nav-link" href="index.html">Home</a></li><li><a class="nav-link" href="shop.html">Shop</a></li><li><a class="nav-link" href="bulk-orders.html">Bulk</a></li><li><a class="nav-link" href="alerts.html">Alerts</a></li><li><a class="nav-link" href="about.html">About</a></li></ul></nav></header><main><section class="section"><div class="container"><div class="utility-bar"><a class="button button-secondary" href="shop.html">← Back to shop</a><a class="button button-secondary" href="checkout.html">View cart <span data-cart-count hidden>0</span></a></div><div id="status" class="status-box">Loading product...</div><article id="product" class="product-detail" hidden></article></div></section></main><footer class="site-footer"><div class="footer-inner container"><div><div class="footer-brand">Swift<span>Supply</span></div><p class="footer-text">Fast. Simple. Convenient.</p></div></div></footer><script src="js/main.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/cart.js"></script><script>
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function money(v){return '$'+Number(v||0).toFixed(2)}
async function load(){const id=new URLSearchParams(location.search).get('id'),s=document.getElementById('status'),root=document.getElementById('product');if(!id){s.textContent='No product was selected.';return}if(!window.sb)return;const {data:p,error}=await sb.from('products').select('*').eq('id',id).eq('active',true).single();if(error||!p){s.textContent='That product could not be found.';return}s.hidden=true;root.hidden=false;document.title=p.name+' | SwiftSupply';root.innerHTML=`<div class="product-detail-image">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<span>SwiftSupply</span>'}</div><div class="product-detail-body"><span class="product-category">${esc(p.category)}</span><h1>${esc(p.name)}</h1><p class="product-detail-description">${esc(p.description||'A SwiftSupply favorite.')}</p><div class="product-detail-price">${money(p.price)}</div>${p.bundle_label?`<p class="bundle-note">${esc(p.bundle_label)}</p>`:''}<p class="stock-pill ${p.stock>0?'in':'out'}">${p.stock>0?p.stock+' in stock':'Out of stock'}</p><div class="cart-controls"><label class="sr-only" for="qty">Quantity</label><input id="qty" class="field cart-qty" type="number" min="1" max="${Math.max(1,p.stock)}" value="1" ${p.stock<1?'disabled':''}><button id="add" class="button button-primary" ${p.stock<1?'disabled':''}>${p.stock>0?'Add to Cart':'Out of Stock'}</button><a class="button button-secondary" href="checkout.html">View Cart</a></div><div id="added" class="form-message"></div></div>`;document.getElementById('add')?.addEventListener('click',()=>{const available=Math.max(0,Number(p.stock||0)-SwiftCart.reserved(p.id)),qty=Math.max(1,Math.min(available,Number(document.getElementById('qty').value)||1)),m=document.getElementById('added');if(available<1){m.textContent='That product is already fully reserved in your cart.';m.classList.add('show');return}const result=SwiftCart.add(p,qty);m.textContent=result.ok?`Added ${qty} × ${p.name} to your cart.`:'Could not add that quantity. Check the stock available in your cart.';m.classList.add('show')})}
document.addEventListener('supabase-ready',load);document.addEventListener('DOMContentLoaded',()=>{if(window.sb)load()});
</script></body></html>
